data:
  raw_url: "http://www.minethatdata.com/Kevin_Hillstrom_MineThatData_E-MailAnalytics_DataMiningChallenge_2008.03.20.csv"
  raw_dir: "./data/raw"
  processed_dir: "./data/processed"
  treatment_col: "segment"
  treatment_value: "Mens E-Mail"
  control_value: "No E-Mail"
  outcome_col: "conversion"

churn:
  churn_threshold_recency: 10
  churn_threshold_history: 200.0

features:
  numeric: ["recency", "history", "mens", "womens", "newbie"]
  categorical: ["zip_code", "channel"]

models:
  churn_lightgbm:
    n_estimators: 500
    learning_rate: 0.03
    num_leaves: 63
    min_child_samples: 30
    subsample: 0.9
    colsample_bytree: 0.9
    reg_alpha: 0.1
    reg_lambda: 0.1
  uplift_lightgbm:
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 40
    subsample: 0.9
    colsample_bytree: 0.9

cv:
  n_splits: 5

optimization:
  budget_per_customer: 5.0
  revenue_per_conversion: 50.0
  max_target_fraction: 0.5
